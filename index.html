<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="theme-color" content="transparent" />
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover"/>
    <title>Driftlands</title>
    <link rel="preload" as="image" href="/boot-splash-art.webp" />
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #0d1320;
        }

        #boot-splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 46%, rgba(9, 13, 21, 0.2) 0 26%, rgba(9, 13, 21, 0.7) 72%, rgba(7, 10, 17, 0.92) 100%),
                linear-gradient(180deg, rgba(13, 19, 32, 0.24), rgba(13, 19, 32, 0.82)),
                url("/boot-splash-art.webp") center / cover no-repeat,
                #0d1320;
            color: #f6e7c6;
            font-family: "Courier New", monospace;
            transition: opacity 240ms ease, visibility 240ms ease;
        }

        #boot-splash::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 231, 170, 0.12), rgba(255, 255, 255, 0));
            transform: translateX(-100%);
            animation: boot-splash-sheen 3.2s ease-in-out infinite;
            pointer-events: none;
        }

        .app-ready #boot-splash {
            opacity: 0;
            visibility: hidden;
        }

        .boot-splash__mark {
            position: relative;
            z-index: 1;
            width: min(76vw, 360px);
            display: grid;
            justify-items: center;
            gap: 18px;
            text-align: center;
            padding: 26px 24px 24px;
            border: 1px solid rgba(246, 231, 198, 0.18);
            border-radius: 8px;
            background: rgba(8, 14, 19, 0.28);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(1.5px);
        }

        .boot-splash__logo {
            width: 84px;
            height: 84px;
            border-radius: 18px;
            background:
                linear-gradient(135deg, #92c06d 0 34%, #d8b167 34% 66%, #5e8ab8 66% 100%);
            box-shadow:
                inset 0 0 0 5px rgba(255, 247, 220, 0.22),
                0 18px 40px rgba(0, 0, 0, 0.34);
            transform: rotate(45deg);
            animation: boot-splash-float 1.6s ease-in-out infinite;
        }

        .boot-splash__title {
            margin: 0;
            font-size: 26px;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .boot-splash__bar {
            width: min(220px, 62vw);
            height: 8px;
            overflow: hidden;
            border: 1px solid rgba(246, 231, 198, 0.32);
            background: rgba(6, 10, 18, 0.52);
        }

        .boot-splash__bar::before {
            content: "";
            display: block;
            width: 42%;
            height: 100%;
            background: #d8b167;
            animation: boot-splash-load 1.1s ease-in-out infinite;
        }

        @keyframes boot-splash-float {
            0%, 100% { transform: translateY(0) rotate(45deg); }
            50% { transform: translateY(-6px) rotate(45deg); }
        }

        @keyframes boot-splash-load {
            0% { transform: translateX(-105%); }
            100% { transform: translateX(245%); }
        }

        @keyframes boot-splash-sheen {
            0%, 42% { transform: translateX(-100%); opacity: 0; }
            50% { opacity: 1; }
            64%, 100% { transform: translateX(100%); opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            #boot-splash,
            #boot-splash::before,
            .boot-splash__logo,
            .boot-splash__bar::before {
                animation: none;
                transition-duration: 80ms;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
<div id="boot-splash" aria-live="polite" aria-label="Loading Driftlands">
    <div class="boot-splash__mark">
        <div class="boot-splash__logo" aria-hidden="true"></div>
        <h1 class="boot-splash__title">Driftlands</h1>
        <div class="boot-splash__bar" aria-hidden="true"></div>
    </div>
</div>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
